[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starworld"
version = "0.1.0"
description = "A cross-layer world model for Starlink prediction and streaming"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "StarWorld contributors"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/luopeng69131/StarWorld"
Issues = "https://github.com/luopeng69131/StarWorld/issues"

[project.scripts]
starworld = "starworld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
